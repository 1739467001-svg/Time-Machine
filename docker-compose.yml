# 一键部署：
#   1) 在本文件同级新建 .env（已被 git 忽略），选择一个引擎并填写对应 key：
#        AGING_PROVIDER=stepfun
#        STEPFUN_API_KEY=your_key
#   2) docker compose up -d --build
#
# 注意：摄像头需要 HTTPS（localhost 除外）。生产请在前面放反向代理做 TLS，
#       详见 docs/DEPLOY.md。
services:
  app:
    build: .
    image: time-machine
    container_name: time-machine
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      AGING_PROVIDER: ${AGING_PROVIDER:-mock}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_IMAGE_MODEL: ${GEMINI_IMAGE_MODEL:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      DASHSCOPE_REGION: ${DASHSCOPE_REGION:-cn}
      DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-}
      QWEN_IMAGE_MODEL: ${QWEN_IMAGE_MODEL:-}
      STEPFUN_API_KEY: ${STEPFUN_API_KEY:-}
      STEPFUN_BASE_URL: ${STEPFUN_BASE_URL:-}
      STEPFUN_IMAGE_MODEL: ${STEPFUN_IMAGE_MODEL:-}
